<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spendwise - Smart Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1> Spendwise</h1>
        <p>Tracker smart. Spendwise.</p>
    </header>
    <main>
        <!--Dashboard-->
        <section class="dashboard">
            <div class="card"><h3>Total Spent</h3><p id="totalSpent">Ksh 0</p></div>
            <div class="card"><h3>Budget</h3><p id="budgetDisplay">KES 5000</p></div>
            <div class="card"><h3>Remaining</h3><p id="Remaining">KES 5000</p></div>
            <div class="card"><h3>Status</h3><p id="statusMessage">Within budget</p></div>
        </section>
        <!--Add Expense Form-->
        <section class="form-section">
            <h2>Add New Expense</h2>
            <form id="expenseForm">
            <input type="text" id="expenseName" placeholder="Expense name e.g. Lunch" required>
            <input type="number" id="ExpenseAmount" placeholder="Amount (KES)" min="1" required>
            <select id="ExpenseCategory" required>
                <option value="">Select category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Shopping">Shopping</option>
                <option value="Entertainment">Entertainment</option>
                <option value="other">Other</option>

            </select>
            <button type="submit">Add Expense</button>
            </form>
            <div class="control">
                <label>Monthly Budget: <input type="number" id="budgetInput" value="5000" min="1"></label>
                <button id="updateBudgetBtn">Update Budget</button>
                <button id="clearBtn">Clear All</button>

            </div>
            <p id="message"></p>

        </section>
        <!--Expense List-->
        <section class="list-section">
            <h2>Your Expenses</h2>
            <div class="filter">
                <button data-filter="All" class="filter-btn active">All</button>
                <button data-filter="Food" class="filter-btn">Food</button>
                <button data-filter="Transport" class="filter-btn">Transport</button>
                <button data-filter="shopping" class="filter-btn">Shopping</button>
                <button data-filter="Entertainment" class="filter-btn">Entertainment</button>
                <button data-filter="other" class="filter-btn">Other</button>


            </div>
            <ul id="expenselist"></ul>
            <p id="emptyMessage">No Expenses yet. Add one above!</p>

        </section>
        <!--Insight-->
        <section class="insight">
            <h2>Smart Insight</h2>
            <p id="insightText">Add expenses to get personalized advice.</p>
        </section>
    </main>
    <script src="script.js"></script>
    
</body>
</html>
